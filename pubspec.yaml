name: optimeal
description: "OptiMeal - Ứng dụng chia sẻ thực phẩm dư thừa (Self-pickup model)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  fpdart: ^1.1.0

  # Navigation & Deep Linking
  go_router: ^14.1.4

  # Firebase Abstraction & Backend
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.4
  cloud_firestore: ^4.17.2
  firebase_storage: ^11.7.4
  firebase_messaging: ^14.9.1

  # Maps, Location & Geocoding
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Hardware & Media
  image_picker: ^1.1.1
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^17.1.2

  # Utilities & Local Storage
  shared_preferences: ^2.2.3
  intl: ^0.20.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/icons/
